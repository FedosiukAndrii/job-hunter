name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JobHunter.slnx

      - name: Verify formatting
        run: dotnet format JobHunter.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build JobHunter.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test JobHunter.slnx
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory TestResults

  jobspy:
    name: JobSpy sidecar (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/jobspy-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/jobspy-api/requirements-dev.lock

      - name: Install locked dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements-dev.lock

      - name: Verify dependencies
        run: python -m pip check

      - name: Test mocked sidecar
        run: python -m pytest
